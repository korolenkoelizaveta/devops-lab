apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cadvisor-worker
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: cadvisor-worker

  template:
    metadata:
      labels:
        app: cadvisor-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"

    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: desktop-worker

      containers:
        - name: cadvisor
          image: ghcr.io/google/cadvisor:0.55.1
          ports:
            - containerPort: 8080
              name: http

          securityContext:
            privileged: true

          resources:
            requests:
              cpu: 100m
              memory: 150Mi
            limits:
              memory: 512Mi

          volumeMounts:
            - name: rootfs
              mountPath: /rootfs
              readOnly: true
            - name: var-run
              mountPath: /var/run
              readOnly: true
            - name: sys
              mountPath: /sys
              readOnly: true
            - name: containerd
              mountPath: /var/lib/containerd
              readOnly: true

      volumes:
        - name: rootfs
          hostPath:
            path: /
        - name: var-run
          hostPath:
            path: /var/run
        - name: sys
          hostPath:
            path: /sys
        - name: containerd
          hostPath:
            path: /var/lib/containerd