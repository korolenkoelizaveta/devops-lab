services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    image: elizavetakek/devops-lab-backend:latest

    ports:
      - "127.0.0.1:8001:8000"

    environment:
      DJANGO_DB_PATH: /data/db.sqlite3

    volumes:
      - sqlite_data:/data
      - media_data:/app/media

    command: >
      sh -c "python manage.py migrate &&
             exec python manage.py runserver 0.0.0.0:8000 --noreload"


  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile

    image: elizavetakek/devops-lab-frontend:latest

    ports:
      - "127.0.0.1:8081:80"

    depends_on:
      - backend
      - statistics

  statistics:
    build:
      context: ./statistics-service
      dockerfile: Dockerfile

    image: elizavetakek/devops-lab-statistics:latest

    environment:
      BACKEND_URL: http://backend:8000

    depends_on:
      - backend

volumes:
  sqlite_data:
    name: devops-lab-sqlite

  media_data:
    name: devops-lab-media